[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz_library"
version = "0.1.0"
description = "A small visualization library built on pandas and matplotlib"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
